<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calc</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <input type="text" id="result" value="0" disabled />
      </div>
      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="calculateSpecial('factorial')">
          n!
        </button>
        <button class="operator" onclick="calculateSpecial('powerOfTen')">
          10^x
        </button>
        <button class="operator" onclick="calculateSpecial('power')">
          x^y
        </button>

        <button class="operator" onclick="calculateSpecial('percent')">
          %
        </button>
        <button class="operator" onclick="calculateSpecial('sqrt')">√</button>
        <button class="operator" onclick="calculateSpecial('reciprocal')">
          1/x
        </button>
        <button class="operator" onclick="calculateSpecial('log')">log</button>

        <button class="operator" onclick="calculateSpecial('ln')">ln</button>
        <button class="operator" onclick="calculateSpecial('pi')">π</button>
        <button class="operator" onclick="calculateSpecial('e')">e</button>
        <button class="operator" onclick="calculateSpecial('exp')">e^x</button>

        <button class="operator" onclick="appendOperator('/')">/</button>
        <button class="operator" onclick="appendOperator('*')">*</button>
        <button class="operator" onclick="appendOperator('-')">-</button>
        <button class="operator" onclick="appendOperator('+')">+</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>

        <button class="zero" onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculateResult()">=</button>
      </div>
    </div>

    <div class="history-container">
      <h3>History</h3>
      <ul id="history-list"></ul>
      <button class="clear-history" onclick="clearHistory()">
        Clear history
      </button>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
